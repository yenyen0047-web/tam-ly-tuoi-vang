<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tâm Lý Tuổi Vàng - Lộ Trình Hưu Trí An Yên & Thong Dong</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        porcelain: { 50: '#FBFBF7', 100: '#FBF9F5', 200: '#F3EFE6', 300: '#E6DFC2' },
                        jade: { 100: '#EBF3EE', 500: '#4A7C59', 600: '#3A6346', 700: '#2A4933' },
                        terracotta: { 100: '#F9EFEA', 500: '#C86D51', 600: '#A9533B' },
                        slate: { 700: '#334155', 800: '#1E293B', 900: '#0F172A' }
                    },
                    fontFamily: {
                        sans: ['System-UI', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .font-size-sm { font-size: 15px; line-height: 1.6; }
        .font-size-base { font-size: 18px; line-height: 1.7; }
        .font-size-lg { font-size: 21px; line-height: 1.8; }
        .font-size-xl { font-size: 24px; line-height: 1.9; }
        .bg-pattern { background-image: radial-gradient(#4A7C59 0.5px, transparent 0.5px); background-size: 16px 16px; opacity: 0.08; }
    </style>
</head>
<body class="bg-porcelain-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 font-size-base min-h-screen flex flex-col justify-between">

    <!-- Accessibility Bar -->
    <div class="bg-porcelain-200 dark:bg-slate-800 border-b border-porcelain-300 dark:border-slate-700 py-2 px-4 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center text-sm gap-2">
            <div class="flex items-center gap-2">
                <span class="font-semibold text-jade-700 dark:text-jade-100"><i class="fa-solid fa-universal-access mr-1"></i> Hỗ trợ đọc:</span>
                <button onclick="changeFontSize('sm')" class="px-2 py-1 bg-white dark:bg-slate-700 rounded border hover:bg-jade-100 font-bold">A-</button>
                <button onclick="changeFontSize('base')" class="px-2 py-1 bg-white dark:bg-slate-700 rounded border hover:bg-jade-100 font-bold">A</button>
                <button onclick="changeFontSize('lg')" class="px-2 py-1 bg-white dark:bg-slate-700 rounded border hover:bg-jade-100 font-bold">A+</button>
                <button onclick="changeFontSize('xl')" class="px-2 py-1 bg-white dark:bg-slate-700 rounded border hover:bg-jade-100 font-bold">A++</button>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleDarkMode()" class="flex items-center gap-1 text-slate-700 dark:text-slate-200 font-medium hover:text-jade-600">
                    <i class="fa-solid fa-circle-half-stroke"></i> <span id="mode-text">Độ tương phản cao</span>
                </button>
                <button onclick="stopAudio()" class="text-terracotta-500 font-medium hidden" id="stop-audio-btn">
                    <i class="fa-solid fa-circle-stop"></i> Dừng đọc
                </button>
            </div>
        </div>
    </div>

    <!-- Header Navigation -->
    <header class="bg-porcelain-50 dark:bg-slate-800 border-b border-porcelain-200 dark:border-slate-700">
        <div class="max-w-6xl mx-auto px-4
